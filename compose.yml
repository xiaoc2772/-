name: redemption

services:
  gateway:
    build:
      context: ./gateway
    environment:
      PORT: "8080"
      API_UPSTREAM: api:8080
      WEB_UPSTREAM: web:3000
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      - web
      - api

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web-runtime
    environment:
      PORT: "3000"
      NODE_ENV: production
      NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL:-http://localhost:8080}
      SESSION_SECRET: ${SESSION_SECRET:-local-development-session-secret-at-least-32-chars}
      ADMIN_USERNAMES: ${ADMIN_USERNAMES:-admin}
    expose:
      - "3000"
    depends_on:
      - api

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      APP_MODE: api
      PORT: "8080"
      DATABASE_URL: postgres://app:app@postgres:5432/app?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      SESSION_SECRET: ${SESSION_SECRET:-local-development-session-secret-at-least-32-chars}
      ADMIN_USERNAMES: ${ADMIN_USERNAMES:-admin}
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:-local-internal-secret-at-least-32-chars}
      NEW_API_URL: ${NEW_API_URL:-}
      NEW_API_ADMIN_ACCESS_TOKEN: ${NEW_API_ADMIN_ACCESS_TOKEN:-}
      NEW_API_ADMIN_USER_ID: ${NEW_API_ADMIN_USER_ID:-}
      NEW_API_ADMIN_USERNAME: ${NEW_API_ADMIN_USERNAME:-}
      NEW_API_ADMIN_PASSWORD: ${NEW_API_ADMIN_PASSWORD:-}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_BUCKET_FEEDBACK_IMAGES: ${S3_BUCKET_FEEDBACK_IMAGES:-feedback-images}
      S3_BUCKET_CARD_IMAGES: ${S3_BUCKET_CARD_IMAGES:-card-images}
      FEEDBACK_MEDIA_DIR: /data/feedback-media
      FEEDBACK_MEDIA_PUBLIC_URL: ${FEEDBACK_MEDIA_PUBLIC_URL:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_API_URL: ${RESEND_API_URL:-https://api.resend.com/emails}
      FARM_MAIL_FROM: ${FARM_MAIL_FROM:-}
    expose:
      - "8080"
    volumes:
      - feedback-media-data:/data/feedback-media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    entrypoint: ["/app/worker"]
    environment:
      APP_MODE: worker
      DATABASE_URL: postgres://app:app@postgres:5432/app?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      SESSION_SECRET: ${SESSION_SECRET:-local-development-session-secret-at-least-32-chars}
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:-local-internal-secret-at-least-32-chars}
      RAFFLE_DELIVERY_CRON_SECRET: ${RAFFLE_DELIVERY_CRON_SECRET:-local-cron-secret-at-least-32-chars}
      CRON_SECRET: ${CRON_SECRET:-local-cron-secret-at-least-32-chars}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_API_URL: ${RESEND_API_URL:-https://api.resend.com/emails}
      FARM_MAIL_FROM: ${FARM_MAIL_FROM:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
  redis-data:
  feedback-media-data:
